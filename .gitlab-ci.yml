# Pipeline do Monitor de Mídia Paga LinkedIn (GitLab CI/CD)
#
# Os jobs rodam por agendamento (Pipeline Schedules do GitLab). Cada schedule
# define a variável SCHEDULE_JOB para escolher qual tarefa executar:
#   SCHEDULE_JOB=daily    -> coleta diária        (sugestão: 0 9 * * *  UTC = 06:00 BRT)
#   SCHEDULE_JOB=weekly   -> report semanal        (sugestão: 0 11 * * 1 UTC = 08:00 BRT seg)
#   SCHEDULE_JOB=monthly  -> report mensal         (sugestão: 0 11 1-3 * * — o job decide o 1º dia útil)
#
# As credenciais ficam em Settings > CI/CD > Variables (marcadas como Masked/Protected).

stages:
  - collect
  - report
  - test
  - deploy

.python_base:
  image: python:3.12
  tags:
    - dind
  before_script:
    - pip install -r requirements.txt
  # Repete automaticamente falhas transitórias (ex.: "Empty reply from server"
  # ao baixar o código, indisponibilidade momentânea do runner/servidor).
  # Bugs de código (script_failure) NÃO são repetidos — falham na hora.
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure
      - api_failure
      - scheduler_failure

coleta_diaria:
  extends: .python_base
  stage: collect
  script:
    - python jobs/daily_collect.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_JOB == "daily"'
    - if: '$CI_PIPELINE_SOURCE == "web"'      # permite rodar manualmente pela interface
      when: manual

report_semanal:
  extends: .python_base
  stage: report
  needs: []          # roda sozinho (não espera a coleta) — no schedule semanal a coleta nem entra
  script:
    - python jobs/weekly_report.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_JOB == "weekly"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

report_mensal:
  extends: .python_base
  stage: report
  needs: []          # roda sozinho (não espera a coleta) — no schedule mensal a coleta nem entra
  script:
    - python jobs/monthly_report.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_JOB == "monthly"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

# Job de teste — imprime a análise no log (não envia e-mail nem altera a planilha).
# Rodar manualmente em CI/CD > Pipelines > Run pipeline (branch main) > botão do job.
testar_analise:
  extends: .python_base
  stage: report
  needs: []          # roda sozinho, sem esperar o stage de coleta
  script:
    - python scripts/test_analise.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

# Preenche a planilha EDITÁVEL do plano (uma vez). Pré-requisito: criar a planilha
# em branco, compartilhá-la (Editor) com a conta de serviço do agente, e cadastrar
# PLANO_SHEET_ID em CI/CD > Variables. Manual: Run pipeline (branch main) > este job.
popular_plano_sheet:
  extends: .python_base
  stage: report
  needs: []
  script:
    - python scripts/popular_plano_sheet.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

# CPL histórico (12 meses) por campanha — imprime no log, não altera nada.
cpl_historico:
  extends: .python_base
  stage: report
  needs: []
  script:
    - python scripts/cpl_historico.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

# Teste de conexão com o vtg-link (publica uma página e compartilha) — manual.
# Precisa das variáveis VTG_LINK_BASE e VTG_LINK_KEY cadastradas no GitLab.
testar_vtglink:
  extends: .python_base
  stage: report
  needs: []
  script:
    - python scripts/testar_vtglink.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

# GATE DE QUALIDADE: compila TODO o código antes de qualquer deploy. Se algum
# arquivo tiver erro de sintaxe, este job falha e o deploy-bot (que depende dele
# via needs) NÃO roda — a produção continua intacta. Só compila, não executa nem
# precisa de credenciais, então roda em segundos sem instalar dependências.
lint:
  extends: .python_base
  stage: test
  needs: []
  before_script: []
  script:
    - python -m compileall -q src jobs api scripts
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

deploy-bot:
  stage: deploy
  needs: ["lint"]        # só deploya se o gate (lint) passar — protege a produção
  image:
    name: alpine:3.20
  tags:
    - dind
  environment:
    name: producao/bot-discord
  resource_group: producao
  interruptible: false
  script:
    - |
      faltando=""
      for v in SSH_KEY SSH_USER SSH_HOST; do
        eval "valor=\${$v:-}"
        [ -n "$valor" ] || faltando="$faltando $v"
      done
      if [ -n "$faltando" ]; then
        echo "ERRO: variável(is) vazia(s):$faltando"
        echo "Causas, em ordem de frequência:"
        echo "  1. Variável marcada 'Protected' e a branch '${CI_COMMIT_REF_NAME:-?}' NÃO é protegida"
        echo "     (Settings > Repository > Protected branches)"
        echo "  2. Environment scope diferente de '${CI_ENVIRONMENT_NAME:-?}' — use '*'"
        echo "  3. Nome divergente em Settings > CI/CD > Variables"
        exit 1
      fi
      echo "destino do deploy: ${SSH_USER}@${SSH_HOST}"

    - apk add --no-cache openssh-client

    - printf '%s\n' "${SSH_KEY}" > deploy_key.pem
    - chmod 400 deploy_key.pem

    - |
      ssh-keygen -y -f deploy_key.pem > /dev/null || { echo "ERRO: chave privada inválida (confira o conteúdo da variável SSH_KEY)"; exit 1; }
      echo "chave privada OK"

    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    - ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts
    - |
      test -s ~/.ssh/known_hosts || { echo "ERRO: keyscan não retornou nada — porta 22 da EC2 inacessível do runner?"; exit 1; }

    - |
      ssh -i "deploy_key.pem" -o StrictHostKeyChecking=no "${SSH_USER}@${SSH_HOST}" "
      set -e
      cd /home/ubuntu/vertigo-linkedin-monitor
      git pull --ff-only
      docker compose up -d --build --wait --wait-timeout 180
      docker image prune -f"

  after_script:
    - |
      if [ -f deploy_key.pem ] && [ -n "${SSH_HOST:-}" ]; then
        ssh -i "deploy_key.pem" -o StrictHostKeyChecking=no "${SSH_USER}@${SSH_HOST}" "
        cd /home/ubuntu/vertigo-linkedin-monitor
        docker compose ps
        docker compose logs --tail 40 bot" || true
      fi
      rm -f deploy_key.pem

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
