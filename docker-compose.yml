name: vertigo-linkedin-monitor
 
services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vtg-linkedin-bot
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
    stop_grace_period: 20s
    # Sem rotação, o log do bot enche o disco da instância com o tempo
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
